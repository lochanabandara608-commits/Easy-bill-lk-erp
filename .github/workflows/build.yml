name: Build Windows EXE
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Check project files
        shell: bash
        run: |
          ls -la
          for f in index.html main.js preload.js package.json build/icon.png build/icon.ico; do
            if [ ! -f "$f" ]; then echo "MISSING FILE IN REPO ROOT: $f"; exit 1; fi
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        shell: bash
        run: npm install --no-audit --no-fund
      - name: Build exe
        shell: bash
        run: npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: EASY-BILL-LK-Setup
          path: dist/*.exe
          if-no-files-found: error
