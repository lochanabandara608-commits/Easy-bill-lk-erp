<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>

<title>EASY BILL LK - ERP & POS System (Upgraded)</title>
<style>
*{box-sizing:border-box} :root{--blue:#2563eb;--dark:#111827;--dark2:#1f2937;--bg:#eef2f7;--border:#d1d5db;--green:#16a34a;--red:#dc2626;--orange:#f59e0b}
body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#111827;overflow:hidden}
button,input,select{font:inherit}button{cursor:pointer;border:0}
.app{display:flex;height:100vh}.sidebar{width:250px;background:var(--dark);color:white;position:fixed;inset:0 auto 0 0;z-index:1000;transition:.25s;overflow:auto}.sidebar.closed{transform:translateX(-100%)}
.logo{height:70px;display:flex;align-items:center;padding:0 20px;font-size:21px;font-weight:bold;border-bottom:1px solid #374151}.logo span{color:#60a5fa;margin-right:7px}
.menu{padding:10px}.menu-title{padding:12px 10px 6px;color:#9ca3af;font-size:11px;text-transform:uppercase}.menu-item{display:flex;align-items:center;justify-content:space-between;padding:12px 13px;margin:3px 0;border-radius:7px;color:#e5e7eb;user-select:none}.menu-item:hover,.menu-item.active{background:var(--blue);color:white}.menu-left{display:flex;gap:10px;align-items:center}.arrow{transition:.2s}.menu-item.open .arrow{transform:rotate(90deg)}.submenu{display:none;padding-left:18px;animation:subOpen .16s ease}.submenu.show{display:block}@keyframes subOpen{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:translateY(0)}}.sub-item{padding:9px 12px;margin:2px 0;border-radius:6px;color:#cbd5e1;cursor:pointer}.sub-item:hover{background:#374151;color:white}
.main{width:100%;margin-left:250px;height:100vh;transition:.25s}.main.full{margin-left:0}.topbar{height:64px;background:white;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 18px}.left-top{display:flex;align-items:center;gap:15px}.hamburger{width:42px;height:40px;background:#eef2ff;border-radius:7px;font-size:22px;color:#1d4ed8}.page-title{font-size:19px;font-weight:bold}.user-box{display:flex;align-items:center;gap:10px}.user-circle{width:35px;height:35px;border-radius:50%;background:var(--blue);color:white;display:grid;place-items:center;font-weight:bold}.content{height:calc(100vh - 64px);overflow:auto;padding:15px}
.page{display:none}.page.active{display:block}.card{background:white;border:1px solid var(--border);border-radius:9px;padding:15px;margin-bottom:15px}.btn{padding:10px 15px;border-radius:7px;color:white;font-weight:bold}.btn-blue{background:var(--blue)}.btn-green{background:var(--green)}.btn-red{background:var(--red)}.btn-orange{background:var(--orange)}.btn-gray{background:#6b7280}.btn-light{background:#e5e7eb;color:#111827}input,select{border:1px solid var(--border);border-radius:6px;padding:10px;width:100%;outline:0}input:focus,select:focus{border-color:var(--blue)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.stat{background:white;border:1px solid var(--border);border-radius:9px;padding:18px}.stat small{color:#6b7280}.stat h2{margin:8px 0}
.pos-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:stretch}.pos-layout>.card{min-height:0}.bill-card{min-height:0}.pos-head{display:flex;gap:6px;margin-bottom:6px}.pos-head input{padding:8px}.pos-head .btn{padding:8px 11px}.pos-head input{flex:1}.bill-card{position:relative}.category-bar{position:absolute;right:8px;top:58px;bottom:10px;width:96px;display:flex;flex-direction:column;gap:7px;overflow-y:auto;overflow-x:hidden;margin:0;padding:4px 3px 10px;height:auto;overscroll-behavior:contain;touch-action:pan-y;scrollbar-width:thin;background:#f1f7ff;border:1px solid #b8d8ff;border-radius:10px;z-index:3}.cat-btn{flex:0 0 auto;width:100%;min-height:46px;white-space:normal;line-height:1.15;text-align:center;background:#dceaff;color:#083b80;border:1px solid #7bb7ff;padding:8px 5px;border-radius:9px;font-size:12px;font-weight:800;touch-action:pan-y}.cat-btn.active{background:#005de8;color:#fff;border-color:#003eaa;box-shadow:0 2px 7px #005de855}.products{margin-right:104px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));gap:6px;height:calc(100vh - 285px);min-height:360px;max-height:560px;overflow:hidden}.product{background:white;border:1px solid var(--border);border-radius:7px;padding:7px;cursor:pointer;min-height:0;height:100%;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}.product-name{font-weight:bold;margin-bottom:3px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.product-price{color:var(--blue);font-weight:bold;font-size:13px}.product-stock{font-size:11px;color:#6b7280;margin-top:3px}.product:hover{border-color:var(--blue);box-shadow:0 2px 7px #0001}
.bill-card{display:flex;flex-direction:column;padding:8px}.bill-card .bill-items{min-height:160px}.bill-card .total-area{flex:none}.bill-header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);padding-bottom:10px}.bill-no{font-weight:bold}.order-type{display:flex;gap:4px;margin:6px 0}.order-type button{padding:7px 4px;font-size:12px}.order-type button{flex:1;padding:9px;border-radius:6px;background:#e5e7eb}.order-type button.active{background:var(--blue);color:white}.change-order-buttons button{font-weight:800}.bill-items{overflow:auto;max-height:calc(100vh - 430px);min-height:140px}.bill-table,.table-list{width:100%;border-collapse:collapse;font-size:13px}.bill-table th,.bill-table td,.table-list th,.table-list td{border-bottom:1px solid #e5e7eb;padding:5px 3px;text-align:left}.qty{display:flex;align-items:center;gap:5px}.qty-input{width:58px;text-align:center;padding:6px;border:1px solid #d1d5db;border-radius:6px;font-weight:700}.qty button{width:24px;height:24px;border-radius:4px;background:#e5e7eb}.total-area{border-top:2px solid #111827;padding-top:8px}.total-row{display:flex;justify-content:space-between;padding:4px 0}.grand{font-size:18px}.discount-box{display:flex;gap:5px;margin:7px 0}.discount-box input{width:100px}.payment-methods{display:grid;grid-template-columns:repeat(2,1fr);gap:5px;margin-top:7px}.pay-btn{padding:9px;border-radius:6px;background:#e5e7eb}.pay-btn.active{background:#111827;color:white}
.items-pager{height:34px;display:flex;align-items:center;justify-content:center;gap:6px;margin-top:5px}.items-pager button{padding:5px 9px;border-radius:5px;background:#e5e7eb;font-size:12px;font-weight:bold}.items-pager button.active{background:var(--blue);color:#fff}.items-pager span{font-size:12px;color:#6b7280}.billing-inline-payment-hidden{display:none !important}.cash-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:7px}.change{background:#ecfdf5;color:#15803d;padding:9px;border-radius:6px;font-weight:bold}.bill-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.bill-actions button{padding:9px 5px;font-size:13px}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:8px}.key{padding:10px;background:#e5e7eb;border-radius:6px;font-weight:bold}.key.zero{grid-column:span 2}
.tables{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.table-box{min-height:105px;background:#ecfdf5;border:2px solid #22c55e;border-radius:10px;padding:12px;cursor:pointer}.table-box.occupied{background:#fff7ed;border-color:#f97316}.table-name{font-weight:bold;font-size:18px}.table-status{margin-top:8px;font-size:13px}.table-total{margin-top:5px;font-weight:bold}
.login-screen{position:fixed;inset:0;background:#111827;display:flex;align-items:center;justify-content:center;z-index:5000}.login-box{width:390px;max-width:94vw;background:white;padding:25px;border-radius:12px}.login-box h1{text-align:center;margin-top:0}.field{margin-bottom:12px}.login-box button{width:100%}.login-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:6000;align-items:center;justify-content:center;padding:15px}.modal.show{display:flex}.modal-box{background:white;border-radius:12px;width:500px;max-width:96vw;max-height:90vh;overflow:auto;padding:20px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.modal-head h3{margin:0}.table-select-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.select-table{padding:15px;border-radius:9px;border:2px solid #22c55e;background:#ecfdf5;text-align:center;font-weight:bold}.select-table.occupied{border-color:#f97316;background:#fff7ed}.select-table:disabled{opacity:.55;cursor:not-allowed}.select-table.available{background:#ecfdf5;border-color:#22c55e;color:#166534}.select-table.pending{background:#fffbeb;border-color:#f59e0b;color:#92400e}.select-table.printed{background:#fef2f2;border-color:#dc2626;color:#991b1b}.select-table.current{background:#eff6ff;border-color:#2563eb;color:#1d4ed8;box-shadow:0 0 0 3px #bfdbfe}
#toast{position:fixed;right:20px;bottom:20px;background:#111827;color:white;padding:12px 16px;border-radius:8px;display:none;z-index:8000}.print-red{color:red!important}
@media(max-width:1200px){.products{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));height:calc(100vh - 285px)}.tables{grid-template-columns:repeat(4,1fr)}.pos-layout{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
@media(max-width:900px){.sidebar{transform:translateX(-100%)}.sidebar.mobile-open{transform:translateX(0)}.main{margin-left:0}.pos-layout{grid-template-columns:1fr}.bill-card{height:auto}.products{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(10,minmax(0,1fr));height:auto;max-height:none;overflow:hidden}.tables{grid-template-columns:repeat(3,1fr)}body{overflow:auto}.content{height:auto}.app{height:auto}}
@media print{
 @page{size:80mm auto;margin:0}
 html,body{margin:0!important;padding:0!important;width:80mm!important;min-width:0!important;height:auto!important;min-height:0!important;background:#fff!important;overflow:visible!important}
 body *{visibility:hidden!important}
 #printArea,#printArea *{visibility:visible!important}
 #printArea{position:absolute;left:0;top:0;width:80mm!important;height:auto!important;min-height:0!important;color:#000;background:#fff;margin:0!important;padding:0!important;overflow:visible!important}
 }
/* Final responsive fixes: keep Start/End Work visible on mobile and prevent topbar overflow. */
.topbar{min-width:0;gap:10px}.left-top{min-width:0}.page-title{overflow-wrap:anywhere}.user-box{min-width:0;flex-wrap:wrap;justify-content:flex-end}.user-box .btn{white-space:nowrap}
@media(max-width:900px){.topbar{height:auto;min-height:64px;flex-wrap:wrap;padding:10px 12px;align-items:flex-start}.left-top{width:100%;gap:10px}.user-box{width:100%;justify-content:flex-start;gap:6px}.user-box .btn{padding:9px 10px;font-size:12px}.user-box #userName{max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.content{height:auto;min-height:calc(100vh - 120px)}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:420px){.user-box{gap:5px}.user-box .btn{padding:8px;font-size:11px}.user-circle{width:30px;height:30px}.user-box #workStatus{font-size:11px!important}}


.permission-grid{display:grid;grid-template-columns:1fr;gap:10px}
.permission-user{display:grid;grid-template-columns:220px 1fr;gap:15px;align-items:start}
.perm-box{display:grid;grid-template-columns:repeat(3,minmax(180px,1fr));gap:8px}
.perm-check{display:flex;align-items:center;gap:7px;background:#f8fafc;border:1px solid #e5e7eb;padding:9px;border-radius:7px}
.perm-check input{width:auto}
.item-actions{display:flex;gap:5px;flex-wrap:wrap}
.small-btn{padding:6px 9px;border-radius:6px;font-size:12px;font-weight:bold}
.table-box.pending{background:#fffbeb;border-color:#f59e0b;color:#92400e}.table-box.printed{background:#fef2f2;border-color:#dc2626;color:#991b1b}.table-box.settled{background:#ecfdf5;border-color:#22c55e;color:#166534}.table-box.current{background:#eff6ff;border-color:#2563eb;color:#1d4ed8;box-shadow:0 0 0 3px #bfdbfe}.table-box.current .table-status{font-weight:900}.table-color-legend{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px}.table-color-legend span{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:800;border:1px solid #d7dee8}.legend-green{background:#dcfce7;color:#166534}.legend-yellow{background:#fef3c7;color:#92400e}.legend-red{background:#fee2e2;color:#991b1b}.legend-blue{background:#dbeafe;color:#1d4ed8}
.status-pill{display:inline-block;padding:3px 7px;border-radius:999px;font-size:11px;font-weight:bold}
.status-pending{background:#fef3c7;color:#92400e}
.status-printed{background:#fee2e2;color:#991b1b}
