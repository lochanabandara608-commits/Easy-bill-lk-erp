<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>EASY BILL LK — Restaurant ERP + POS</title>
<meta name="theme-color" content="#1769d1">

<style>
:root{
 --blue:#1769d1;--blue2:#0d4fa8;--green:#39a852;
 --bg:#f3f7fc;--card:#fff;--text:#172033;--muted:#6d7787;
 --line:#e5eaf1;--danger:#e5484d;--warning:#f59e0b;
 --shadow:0 8px 28px rgba(24,63,110,.08);
 --radius:14px;--sidebar:260px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:12px}

/* LOGIN */
.login{
 min-height:100vh;display:grid;place-items:center;
 background:linear-gradient(135deg,#eef7ff,#f7fff8);padding:20px
}
.login-box{
 width:min(430px,100%);background:#fff;border:1px solid var(--line);
 border-radius:22px;box-shadow:0 20px 60px rgba(16,65,120,.13);padding:30px
}
.logo{display:flex;align-items:center;gap:12px}
.logo img{width:54px;height:54px;border-radius:50%;object-fit:cover}
.logo b{font-size:22px;color:#1769d1}
.logo span{display:block;font-size:12px;color:var(--muted);margin-top:3px}

/* FORM */
.field{margin:14px 0}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}
.field input,.field select,.field textarea{
 width:100%;border:1px solid #dce3ed;border-radius:10px;
 padding:11px 12px;outline:none;background:#fff
}
.field input:focus,.field select:focus,.field textarea:focus{
 border-color:var(--blue);box-shadow:0 0 0 3px rgba(23,105,209,.1)
}
.btn{
 border:0;border-radius:10px;padding:10px 14px;font-weight:700
}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue2)}
.btn-green{background:var(--green);color:#fff}
.btn-danger{background:#fee7e8;color:#c62e35}
.btn-light{background:#eef4fb;color:#195da9}
.btn-white{background:#fff;border:1px solid var(--line)}
.btn-sm{padding:7px 10px;font-size:12px}
.btn-block{width:100%}

/* APP */
.app{display:none;min-height:100vh}
.app.active{display:flex}

.sidebar{
 position:fixed;left:0;top:0;bottom:0;width:var(--sidebar);
 background:linear-gradient(180deg,#0c2d50,#061f38);
 color:#dcecff;z-index:50;overflow:auto;transition:.25s
}
.brand{
 height:72px;display:flex;align-items:center;gap:10px;padding:10px 16px;
 border-bottom:1px solid rgba(255,255,255,.1)
}
.brand img{width:43px;height:43px;border-radius:50%;object-fit:cover}
.brand strong{font-size:16px}
.brand small{display:block;color:#9fc1e3;font-size:10px;margin-top:2px}

.nav{padding:12px 9px}
.nav-title{
 font-size:10px;text-transform:uppercase;color:#7598bc;
 padding:12px 11px 6px;letter-spacing:1px
}
.nav button{
 width:100%;border:0;background:none;color:#dcecff;text-align:left;
 padding:11px 12px;border-radius:9px;display:flex;
 align-items:center;gap:10px;margin:2px 0
}
.nav button:hover,.nav button.active{background:#155a9d;color:#fff}
.nav .ico{width:20px;text-align:center}
.nav .chev{margin-left:auto;transition:.2s}
.nav button.open .chev{transform:rotate(180deg)}
.submenu{display:none;padding-left:34px}
.submenu.open{display:block}
.submenu button{font-size:12px;padding:8px 10px;color:#b9d3ed}

.main{
 margin-left:var(--sidebar);width:calc(100% - var(--sidebar));min-width:0
}
.topbar{
 height:72px;background:#fff;border-bottom:1px solid var(--line);
 display:flex;align-items:center;gap:12px;padding:0 20px;
 position:sticky;top:0;z-index:30
}
.hamb{
 display:none;border:0;background:#eef4fb;border-radius:9px;padding:9px
}
.topbar .grow{flex:1}
.account-pill{display:flex;align-items:center;gap:9px}
.avatar{
 width:38px;height:38px;border-radius:50%;background:#e6f0ff;
 color:#1769d1;display:grid;place-items:center;font-weight:800
}
.page{padding:20px;max-width:1700px;margin:auto}
.page-head{
 display:flex;justify-content:space-between;align-items:center;
 gap:12px;margin-bottom:18px
}
.page-head h1{margin:0;font-size:24px}
.page-head p{margin:5px 0 0;color:var(--muted);font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap}

.grid{display:grid;gap:16px}
.stats{grid-template-columns:repeat(4,minmax(0,1fr))}
.stat{
 background:#fff;border:1px solid var(--line);border-radius:var(--radius);
 padding:17px;box-shadow:var(--shadow)
}
.stat .top{display:flex;justify-content:space-between;align-items:center}
.stat .icon{
 width:38px;height:38px;border-radius:10px;
 display:grid;place-items:center;background:#eaf3ff
}
.stat h3{margin:12px 0 4px;font-size:24px}
.stat p{margin:0;color:var(--muted);font-size:12px}

.two{grid-template-columns:1.35fr .9fr}
.three{grid-template-columns:repeat(3,1fr)}

.card{
 background:#fff;border:1px solid var(--line);border-radius:var(--radius);
 box-shadow:var(--shadow);overflow:hidden
}
.card-head{
 padding:15px 16px;border-bottom:1px solid var(--line);
 display:flex;justify-content:space-between;align-items:center;gap:10px
}
.card-head h3{font-size:15px;margin:0}
.card-body{padding:16px}

table{width:100%;border-collapse:collapse;font-size:13px}
th,td{
 text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);
 vertical-align:middle
}
th{font-size:11px;color:#657185;text-transform:uppercase;background:#fbfcfe}
tr:hover td{background:#fafcff}

.badge{
 display:inline-block;border-radius:999px;padding:4px 8px;
 font-size:10px;font-weight:800
}
.ok{background:#e8f8ec;color:#23803a}
.low{background:#fff5dd;color:#a46a00}
.out{background:#fee7e8;color:#c62e35}
.info{background:#e8f1ff;color:#185fae}

.empty{padding:30px;text-align:center;color:var(--muted)}

.toolbar{
 display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:14px
}
.search{flex:1;min-width:180px;position:relative}
.search input{
 width:100%;padding:11px 12px 11px 38px;
 border:1px solid var(--line);border-radius:10px
}
.search span{position:absolute;left:13px;top:10px;color:#7c8798}
.select{
 min-width:150px;padding:10px;border:1px solid var(--line);
 border-radius:10px;background:#fff
}

/* MODAL */
.modal{
 position:fixed;inset:0;background:rgba(7,24,45,.5);
 display:none;align-items:center;justify-content:center;
 padding:20px;z-index:100
}
.modal.show{display:flex}
.modal-box{
 width:min(900px,100%);max-height:92vh;overflow:auto;background:#fff;
 border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.2)
}
.modal-head{
 padding:16px 18px;border-bottom:1px solid var(--line);
 display:flex;justify-content:space-between;align-items:center
}
.modal-head h3{margin:0}
.modal-body{padding:18px}
.modal-foot{
 padding:14px 18px;border-top:1px solid var(--line);
 display:flex;justify-content:flex-end;gap:8px
}
.x{border:0;background:#f1f4f8;border-radius:8px;padding:7px 10px}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.form-grid .full{grid-column:1/-1}

.toast{
 position:fixed;right:20px;bottom:20px;background:#102a43;color:#fff;
 padding:12px 16px;border-radius:10px;
 box-shadow:0 12px 35px rgba(0,0,0,.2);z-index:300;display:none
}
.toast.show{display:block}

/* POS */
.pos{
 display:grid;grid-template-columns:minmax(0,1.5fr) minmax(360px,.75fr);gap:16px
}
.product-grid{
 display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));
 gap:10px;max-height:65vh;overflow:auto
}
.product{
 border:1px solid var(--line);border-radius:12px;padding:12px;
 background:#fff;text-align:left
}
.product:hover{
 border-color:#8bb7eb;
 box-shadow:0 6px 18px rgba(23,105,209,.08)
}
.product:disabled{opacity:.45;cursor:not-allowed}
.product .pic{
 height:74px;border-radius:9px;background:#eef5fd;
 display:grid;place-items:center;font-size:28px;margin-bottom:9px
}
.product b{font-size:13px;display:block}
.product small{display:block;color:var(--muted);margin-top:4px}
.product strong{
 display:block;margin-top:7px;color:#1769d1
}

.cart{position:sticky;top:92px}
.cart-list{max-height:43vh;overflow:auto}
.cart-row{
 display:grid;grid-template-columns:1fr auto;gap:8px;
 padding:11px 0;border-bottom:1px solid var(--line)
}
.qty{display:flex;align-items:center;gap:5px}
.qty button{
 width:27px;height:27px;border:0;border-radius:6px;background:#edf3fb
}
.totals{margin-top:12px}
.total-line{display:flex;justify-content:space-between;padding:5px 0}
.grand{
 font-size:19px;font-weight:800;border-top:1px dashed #ccd5e2;
 margin-top:6px;padding-top:10px
}

/* RESTAURANT */
.service-tabs{
 display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px
}
.service-tab{
 padding:15px;border:2px solid var(--line);border-radius:13px;
 background:#fff;font-weight:800;font-size:15px
}
.service-tab.active{
 border-color:#1769d1;background:#eef6ff;color:#1769d1
}

.table-grid{
 display:grid;
 grid-template-columns:repeat(5,minmax(120px,1fr));
 gap:14px
}
.restaurant-table{
 min-height:120px;border-radius:15px;border:2px solid #dfe6ef;
 background:#fff;padding:13px;text-align:left;
 box-shadow:0 5px 16px rgba(20,50,90,.06);
 position:relative
}
.restaurant-table:hover{
 border-color:#1769d1;transform:translateY(-2px)
}
.restaurant-table.free{border-color:#cfe8d4}
.restaurant-table.busy{border-color:#f2b7ba;background:#fff8f8}
.restaurant-table.printed{
 border-color:#8a62d8;background:#f6f0ff
}
.table-number{font-size:19px;font-weight:900}
.table-status{font-size:11px;font-weight:800;margin-top:6px}
.table-total{font-size:14px;font-weight:900;margin-top:9px}
.table-actions{display:flex;gap:5px;margin-top:9px}
.table-actions button{
 flex:1;border:0;border-radius:7px;padding:6px;font-size:11px
}

/* NUMERIC KEYPAD */
.keypad{
 display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px
}
.key{
 border:1px solid var(--line);background:#f8fafc;
 border-radius:10px;padding:15px;font-size:18px;font-weight:800
}
.key:hover{background:#eaf3ff}
.key.clear{background:#fee7e8;color:#c62e35}
.key.ok{background:#e8f8ec;color:#23803a}

/* TABLE BILL MODAL */
.table-bill-header{
 display:flex;justify-content:space-between;align-items:center;
 padding:12px;background:#f7f9fc;border-radius:10px;margin-bottom:12px
}
.table-bill-item{
 display:flex;justify-content:space-between;align-items:center;
 padding:10px 0;border-bottom:1px solid var(--line)
}
.table-bill-total{
 background:#eef6ff;border-radius:12px;padding:14px;
 margin-top:12px;font-size:20px;font-weight:900;
 display:flex;justify-content:space-between
}

/* PRINT */
.printed-table{
 border:2px solid #8a62d8!important;
 background:#f6f0ff!important
}

/* CHART */
.bar{height:10px;background:#edf1f6;border-radius:99px;overflow:hidden}
.bar i{
 display:block;height:100%;
 background:linear-gradient(90deg,#1769d1,#44a6ff);
 border-radius:99px
}
.chart{
 height:220px;display:flex;align-items:end;gap:8px;
 padding:15px 5px 0
}
.chart .col{
 flex:1;text-align:center;font-size:10px;color:#7a8494
}
.chart i{
 display:block;max-width:32px;margin:0 auto 7px;
 background:linear-gradient(180deg,#3293f5,#1769d1);
 border-radius:7px 7px 2px 2px;min-height:5px
}

.kpi-list{display:grid;gap:10px}
.kpi{
 display:flex;justify-content:space-between;align-items:center;
 padding:11px;background:#f8fafc;border-radius:10px
}
.notice{
 padding:11px 12px;border-radius:10px;
 background:#eef7ff;color:#205e99;font-size:12px;margin-bottom:10px
}
.switch{display:flex;align-items:center;gap:9px}
.switch input{width:40px;height:21px}
.footer-note{text-align:center;color:#8a95a6;font-size:11px;padding:24px}

/* DESKTOP FIX */
@media(min-width:1001px){
 .page{min-width:1100px}
 .pos{min-height:720px}
 .product-grid{max-height:70vh}
 .cart-list{max-height:50vh}
}

/* TABLET / MOBILE */
@media(max-width:1200px){
 .table-grid{grid-template-columns:repeat(4,minmax(110px,1fr))}
}
@media(max-width:1000px){
 .stats{grid-template-columns:repeat(2,1fr)}
 .two,.pos{grid-template-columns:1fr}
 .cart{position:static}
 .sidebar{transform:translateX(-100%)}
 .sidebar.show{transform:translateX(0)}
 .main{margin-left:0;width:100%}
 .hamb{display:block}
 .table-grid{grid-template-columns:repeat(3,minmax(100px,1fr))}
}
@media(max-width:650px){
 .page{padding:13px;min-width:0}
 .topbar{padding:0 12px}
 .stats,.three{grid-template-columns:1fr}
 .form-grid{grid-template-columns:1fr}
 .form-grid .full{grid-column:auto}
 .page-head{align-items:flex-start;flex-direction:column}
 .account-pill .acct-extra{display:none}
 table{min-width:720px}
 .table-grid{grid-template-columns:repeat(2,minmax(110px,1fr))}
 .product-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login" class="login">
 <div class="login-box">
  <div class="logo">
   <div style="width:54px;height:54px;border-radius:50%;background:#eaf3ff;display:grid;place-items:center;font-size:25px">🧾</div>
   <div>
    <b>EASY BILL LK</b>
    <span>Restaurant ERP • POS</span>
   </div>
  </div>

  <h2 style="margin:28px 0 6px">Welcome Back</h2>
  <p class="muted" style="margin-top:0">Sign in to your business account</p>

   <select id="loginAccount"></select>
  </div>

  </div>
 </div>
</div>

<!-- APP -->
<div id="app" class="app">

<aside id="sidebar" class="sidebar">

 <div class="brand">
  <div style="width:43px;height:43px;border-radius:50%;background:#fff;color:#1769d1;display:grid;place-items:center;font-size:20px">🧾</div>
  <div>
   <strong>EASY BILL LK</strong>
   <small>RESTAURANT ERP • POS</small>
  </div>
 </div>

 <nav class="nav">

  <div class="nav-title">Main</div>

  <button data-page="dashboard" onclick="go('dashboard')">
   <span class="ico">⌂</span>Dashboard
  </button>

  <button data-page="pos" onclick="go('pos')">
   <span class="ico">🛒</span>POS / Sales

  </button>

  <button data-page="items" onclick="go('items')">
   <span class="ico">▣</span>Items
  </button>

  <button class="parent" onclick="toggleMenu(this,'manageMenu')">

   <span class="ico">▥</span>Reports & Analytics
  </button>

  <div class="nav-title">System</div>

  <button class="parent" onclick="toggleMenu(this,'systemMenu')">
   <span class="ico">⚙</span>Settings
   <span class="chev">⌄</span>
  </button>

  <div id="systemMenu" class="submenu">
   <button onclick="go('settings')">Business Settings</button>
   <button onclick="go('configs')">POS Configs</button>
   <button onclick="backupData()">Backup / Export</button>
   <button onclick="restoreData()">Restore JSON</button>
  </div>

  <button onclick="logout()">
   <span class="ico">⇥</span>Sign Out
  </button>

 </nav>
</aside>

<main class="main">

<header class="topbar">

 <button class="hamb" onclick="toggleSidebar()">☰</button>

 <div class="grow">
  <b id="pageTitle">Dashboard</b>

 </div>

 <div class="account-pill">

 </div>

<!-- MODAL -->
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()">
 <div class="modal-box">
  <div class="modal-head">
   <h3 id="modalTitle">Modal</h3>
   <button class="x" onclick="closeModal()">✕</button>
  </div>

  <div id="modalBody" class="modal-body"></div>
  <div id="modalFoot" class="modal-foot"></div>
 </div>
</div>

<div id="toast" class="toast"></div>

<input id="restoreInput" type="file" accept=".json" style="display:none" onchange="handleRestore(event)">

<script>

/* ================= DATABASE ================= */

const KEY="easy_bill_lk_restaurant_v20";

let DB=JSON.parse(localStorage.getItem(KEY)||"null");

function uid(prefix="ID"){
 return prefix+"-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,7).toUpperCase();
}

function newAccount(name="My Restaurant",owner="admin"){

 return {
  id:uid("ACC"),
  name:name,
  owner:owner,
  created:new Date().toISOString(),

  settings:{
   phone:"",
   email:"",
   address:"Sri Lanka",
   currency:"Rs.",
   tax:0,
   invoicePrefix:"INV-"
  },

  users:[
   {
    id:uid("USR"),
    name:"Administrator",
    username:owner,
    password:"1234",
    role:"Administrator",
    active:true
   }
  ],

  items:[
   {id:uid("ITM"),sku:"1001",name:"Chicken Fried Rice",category:"Rice",price:1200,cost:750,stock:50,reorder:10,expiry:"",unit:"Plate"},
   {id:uid("ITM"),sku:"1002",name:"Chicken Kottu",category:"Kottu",price:1400,cost:850,stock:40,reorder:10,expiry:"",unit:"Plate"},
   {id:uid("ITM"),sku:"1003",name:"Cheese Burger",category:"Burger",price:1100,cost:650,stock:30,reorder:8,expiry:"",unit:"Piece"},
   {id:uid("ITM"),sku:"1004",name:"French Fries",category:"Short Eats",price:650,cost:350,stock:45,reorder:10,expiry:"",unit:"Portion"},
   {id:uid("ITM"),sku:"1005",name:"Coca Cola",category:"Beverage",price:350,cost:220,stock:80,reorder:15,expiry:"",unit:"Bottle"},
   {id:uid("ITM"),sku:"1006",name:"Fresh Lime",category:"Beverage",price:450,cost:180,stock:60,reorder:10,expiry:"",unit:"Glass"},
   {id:uid("ITM"),sku:"1007",name:"Chocolate Cake",category:"Dessert",price:800,cost:450,stock:20,reorder:5,expiry:"2026-09-30",unit:"Piece"}
  ],

  sales:[],
  purchases:[],
  customers:[
   {id:uid("CUS"),name:"Walk-in Customer",phone:"",credit:0}
  ],
  suppliers:[],
  expenses:[],
  dailyPurchases:[],

  restaurant:{
   tables:Array.from({length:20},(_,i)=>({
    id:"T"+(i+1),
    name:"Table "+(i+1),
    capacity:i<4?2:i<12?4:6,
    status:"free",
    cart:[],
    lastPrinted:false,
    printedAt:null
   }))
  }
 };
}

if(!DB){
 DB={
  accounts:[newAccount("Easy Bill LK Restaurant","admin")],
  activeAccount:null,
  currentUser:null,
  config:{
   lowStock:5,
   currency:"Rs.",
   receiptFooter:"Thank you. Come Again!"
  }
 };

 DB.activeAccount=DB.accounts[0].id;
 saveDB();
}

if(!DB.config)DB.config={lowStock:5,currency:"Rs.",receiptFooter:"Thank you. Come Again!"};

function saveDB(){
 localStorage.setItem(KEY,JSON.stringify(DB));
}

function acc(){
 return DB.accounts.find(a=>a.id===DB.activeAccount)||DB.accounts[0];
}

function money(n){
 return (acc()?.settings?.currency||"Rs.")+" "+
 Number(n||0).toLocaleString("en-LK",{
  minimumFractionDigits:2,
  maximumFractionDigits:2
 });
}

function today(){
 return new Date().toISOString().slice(0,10);
}

function esc(s){
 return String(s??"").replace(/[&<>"']/g,m=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#039;"
 }[m]));
}

function toast(s){
 const t=document.getElementById("toast");
 t.textContent=s;
 t.classList.add("show");
 setTimeout(()=>t.classList.remove("show"),2300);
}

function daysLeft(date){
 if(!date)return 99999;
 return Math.ceil(
  (new Date(date+"T23:59:59")-new Date())/86400000
 );
}

function dateFmt(d){
 return d?new Date(d).toLocaleDateString("en-GB"):"";
}

function drawProducts(){

  .toLowerCase();

 const arr=a.items.filter(i=>
  (!q||
   i.name.toLowerCase().includes(q)||
   i.sku.toLowerCase().includes(q)
  )&&
  (!cat||i.category===cat)
 );

 document.getElementById("products").innerHTML=

 arr.map(i=>`

  <button class="product"
          onclick="addCart('${i.id}')"
          ${i.stock<=0?"disabled":""}>

   <div class="pic">
    ${categoryIcon(i.category)}
   </div>

   <b>${esc(i.name)}</b>

   <small>
    ${esc(i.sku)} • ${i.stock} ${esc(i.unit)}
   </small>

   <strong>${money(i.price)}</strong>

  </button>

 `).join("")||
 `<div class="empty">No products found</div>`;

function categoryIcon(c){

 c=(c||"").toLowerCase();

 if(c.includes("rice"))return"🍚";
 if(c.includes("kottu"))return"🍛";
 if(c.includes("burger"))return"🍔";
 if(c.includes("beverage"))return"🥤";
 if(c.includes("dessert"))return"🍰";
 if(c.includes("short"))return"🍟";

 return"🍽️";
}

function addCart(id){

 const i=acc().items.find(x=>x.id===id);

 if(!i||i.stock<=0){
  toast("Item out of stock");
  return;
 }

 let r=cart.find(x=>x.id===id);

 if(r){

  if(r.qty>=i.stock){
   toast("Not enough stock");
   return;
  }

  r.qty++;

 }else{

  cart.push({
   id:id,
   qty:1
  });

 }

 drawCart();
}

function changeQty(id,d){

 let r=cart.find(x=>x.id===id);
 let i=acc().items.find(x=>x.id===id);

 if(!r)return;

 r.qty+=d;

 if(r.qty<=0){
  cart=cart.filter(x=>x.id!==id);
 }

 if(r.qty>i.stock){
  r.qty=i.stock;
 }

 drawCart();
}

function drawCart(){

 const a=acc();
 const box=document.getElementById("cartList");

 if(!box)return;

 box.innerHTML=

 cart.map(r=>{

  return `

     <b>${r.qty}</b>

    </div>

 }).join("")||

 `<div class="empty">
  Cart is empty
 </div>`;

 const sub=cart.reduce((s,r)=>{

 },0);

/* ================= COMPLETE SALE ================= */

function completeSale(
 orderType,
 table,
 customer,
 payment,
 orderCart
){

 const a=acc();

 let sub=0;
 let profit=0;

 orderCart.forEach(r=>{

  const i=a.items.find(x=>x.id===r.id);

  if(!i)return;

  sub+=i.price*r.qty;
  profit+=(i.price-i.cost)*r.qty;

 });

 const tax=sub*(Number(a.settings.tax)||0)/100;
 const total=sub+tax;

 const inv=
  (a.settings.invoicePrefix||"INV-")+
  String(a.sales.length+1).padStart(5,"0");

 orderCart.forEach(r=>{

  const i=a.items.find(x=>x.id===r.id);

  if(i)i.stock=Math.max(0,i.stock-r.qty);

 });

 const sale={

  id:uid("SAL"),

  invoice:inv,

  date:today(),

  time:new Date().toLocaleTimeString(),

  orderType:orderType,

  tableId:table?.id||null,

  tableName:table?.name||null,

  customer:customer,

  payment:payment,

  subtotal:sub,

  tax:tax,

  total:total,

  profit:profit,

  lines:orderCart.map(r=>({...r})),

  printed:false

 };

 a.sales.push(sale);

 if(orderType==="Table"&&table){

  table.cart=[];
  table.status="free";
  table.lastPrinted=true;
  table.printedAt=new Date().toISOString();
 }

 saveDB();

 printReceipt(sale);

 cart=[];
 currentTableId=null;
 currentOrderType="Takeaway";

 toast("Sale completed: "+inv);

 setTimeout(()=>go("pos"),400);
}

 const tax=sub*(Number(a.settings.tax)||0)/100;
 const total=sub+tax;

 const win=window.open("","_blank","width=420,height=700");

 if(!win){
  toast("Allow popups to print");
  return;
 }

 win.document.write(receiptHTML({

  invoice:"TABLE-"+t.id,

  orderType:"Table",

  tableName:t.name,

  customer:"Walk-in Customer",

  payment:"Pending",

  lines:t.cart,

  subtotal:sub,

  tax:tax,

  total:total

 }));

 win.document.close();
 win.focus();

 setTimeout(()=>{
  win.print();
 },300);

 t.lastPrinted=true;
 t.printedAt=new Date().toISOString();

 saveDB();

 toast(t.name+" bill printed");

 setTimeout(()=>renderTables(),500);
}

function printReceipt(s){

 const win=window.open(
  "",
  "_blank",
  "width=420,height=700"
 );

 if(!win){
  toast("Allow popups to print");
  return;
 }

 win.document.write(receiptHTML(s));
 win.document.close();
 win.focus();

 setTimeout(()=>{
  win.print();
 },300);
}

/* ================= NUMERIC KEYPAD ================= */

function showNumericKeypad(){

 showModal(

  "Numeric Keypad",

  `

  <div class="field">

   <label>Quantity / Number</label>

   <input id="numericValue"
          type="text"
          inputmode="numeric"
          value=""
          style="font-size:25px;text-align:right;font-weight:bold">

  </div>

  <div class="keypad">

   ${["7","8","9","4","5","6","1","2","3","0","00","⌫"]
    .map(x=>`
     <button class="key"
             onclick="keyPress('${x}')">
      ${x}
     </button>
    `).join("")}

   <button class="key clear"
           onclick="document.getElementById('numericValue').value=''">
    CLEAR
   </button>

   <button class="key ok"
           onclick="applyNumericValue()">
    OK
   </button>

  </div>

  `,

  `<button class="btn btn-white" onclick="closeModal()">Close</button>`

 );
}

function keyPress(k){

 const input=document.getElementById("numericValue");

 if(!input)return;

 if(k==="⌫"){
  input.value=input.value.slice(0,-1);
  return;
 }

 input.value+=k;
}

function applyNumericValue(){

 const value=parseInt(
  document.getElementById("numericValue").value||"0"
 );

 if(!value||!cart.length){
  closeModal();
  return;
 }

 /* keypad quantity changes first item */
 cart[0].qty=Math.min(
  value,
  acc().items.find(i=>i.id===cart[0].id)?.stock||value
 );

 closeModal();
 drawCart();
}

/* ================= HOLD BILL ================= */

function holdBill(){

 if(!cart.length){
  toast("Cart is empty");
  return;
 }

 let holds=
 JSON.parse(localStorage.getItem("easy_bill_holds")||"[]");

 holds.push({
  id:uid("HOLD"),
  date:today(),
  account:acc().id,
  orderType:currentOrderType,
  tableId:currentTableId,
  cart:cart.map(x=>({...x}))
 });

 localStorage.setItem(
  "easy_bill_holds",
  JSON.stringify(holds)
 );

 cart=[];

 toast("Bill held successfully");
}

function drawItems(){

 const a=acc();

 const q=
 (document.getElementById("itemQ")?.value||"").toLowerCase();

 const cat=
 document.getElementById("itemCat")?.value||"";

 const arr=a.items.filter(i=>
  (!q||
   i.name.toLowerCase().includes(q)||
   i.sku.toLowerCase().includes(q)
  )&&
  (!cat||i.category===cat)
 );

 document.getElementById("itemRows").innerHTML=

 arr.map(i=>`

 <tr>

  <td>${esc(i.sku)}</td>

  <td>
   <b>${esc(i.name)}</b>
   <div class="small muted">${esc(i.unit)}</div>
  </td>

  <td>${esc(i.category)}</td>

  <td>${money(i.cost)}</td>

  <td>${money(i.price)}</td>

  <td>
   <span class="badge ${
    i.stock<=0?"out":
    i.stock<=i.reorder?"low":"ok"
   }">
    ${i.stock}
   </span>
  </td>

  <td>
   <button class="btn btn-light btn-sm"
           onclick="openItemModal('${i.id}')">
    Edit
   </button>

   <button class="btn btn-danger btn-sm"
           onclick="deleteItem('${i.id}')">
    Delete
   </button>
  </td>

 </tr>

 `).join("")||

 `<tr>
  <td colspan="7" class="empty">No items</td>
 </tr>`;
}

    Cancel

function saveItem(id){

 const a=acc();

 const o={

  id:id||uid("ITM"),

  sku:document.getElementById("f_sku").value.trim(),

  name:document.getElementById("f_name").value.trim(),

  category:
  document.getElementById("f_category").value.trim()||"General",

  unit:document.getElementById("f_unit").value,

  cost:+document.getElementById("f_cost").value||0,

  price:+document.getElementById("f_price").value||0,

  stock:+document.getElementById("f_stock").value||0,

  reorder:+document.getElementById("f_reorder").value||0,

  expiry:document.getElementById("f_expiry").value
 };

 if(!o.name||!o.sku){
  toast("Name and SKU are required");
  return;
 }

 const ix=a.items.findIndex(x=>x.id===id);

 if(ix>=0)a.items[ix]=o;
 else a.items.push(o);

 saveDB();

 closeModal();

 toast("Item saved");

 renderItems();
}

function deleteItem(id){

 if(!confirm("Delete this item?"))return;

 acc().items=
 acc().items.filter(i=>i.id!==id);

 saveDB();

 renderItems();

 toast("Item deleted");
}

function openStockModal(id){

  "Adjust Stock",

  `

   Current stock:
   <b>${i.stock}</b> ${esc(i.unit)}

   <select id="stockItem">

    ${a.items.map(x=>
     `<option value="${x.id}"

    ).join("")}

   </select>

           type="number"

function adjustStock(){

 const a=acc();

 const i=a.items.find(
  x=>x.id===document.getElementById("stockItem").value
 );

 i.stock=Math.max(
  0,
  i.stock+(+document.getElementById("stockAdj").value||0)
 );

 saveDB();

 closeModal();

 toast("Stock updated");

 renderInventory();
}

function savePurchase(){

 const a=acc();

 const i=a.items.find(
  x=>x.id===document.getElementById("p_item").value
 );

 const q=
 +document.getElementById("p_qty").value||0;

 const c=
 +document.getElementById("p_cost").value||0;

 if(!i||q<=0){
  toast("Enter valid purchase");
  return;
 }

 i.stock+=q;
 i.cost=c;

 a.purchases.push({

  id:uid("PUR"),

  ref:
  "PUR-"+String(a.purchases.length+1).padStart(5,"0"),

  date:
  document.getElementById("p_date").value,

  supplier:
  document.getElementById("p_supplier").value||
  "General Supplier",

  lines:[
   {
    item:i.id,
    qty:q,
    cost:c
   }
  ],

  total:q*c,

  status:"Received"
 });

 saveDB();

 closeModal();

 toast("Purchase received");

 renderPurchasing();
}

function saveAccount(id){

 const name=
 document.getElementById("a_name").value.trim();

 if(!name){
  toast("Business name required");
  return;
 }

 if(id){

  const a=DB.accounts.find(x=>x.id===id);

  a.name=name;
  a.owner=
   document.getElementById("a_owner").value.trim()||
   "admin";

 }else{

  const a=newAccount(
   name,
   document.getElementById("a_owner").value.trim()||"admin"
  );

  DB.accounts.push(a);
 }

 saveDB();
 loadLoginAccounts();

 closeModal();

 toast("Business account saved");

 if(DB.currentUser)renderAccounts();
}

function activateAccount(id){

 DB.activeAccount=id;

 DB.currentUser=
 DB.accounts.find(a=>a.id===id).users[0].id;

 saveDB();

 updateHeader();

 go("dashboard");

 toast("Business switched");
}

function editAccount(id){
 openAccountModal(id);
}

function deleteAccount(id){

 if(DB.accounts.length<=1){
  toast("At least one business account is required");
  return;
 }

 if(!confirm(
  "Delete this entire business account and its data?"
 ))return;

 DB.accounts=
 DB.accounts.filter(a=>a.id!==id);

 if(DB.activeAccount===id){
  DB.activeAccount=DB.accounts[0].id;
 }

 saveDB();

 renderAccounts();

 toast("Account deleted");
}

/* ================= BACKUP ================= */

function backupData(){

 const blob=new Blob(
  [JSON.stringify(DB,null,2)],
  {type:"application/json"}
 );

 const a=document.createElement("a");

 a.href=URL.createObjectURL(blob);

 a.download=
 "easy-bill-lk-backup-"+today()+".json";

 a.click();

 URL.revokeObjectURL(a.href);

 toast("Backup downloaded");
}

function restoreData(){
 document.getElementById("restoreInput").click();
}

function handleRestore(e){

 const f=e.target.files[0];

 if(!f)return;

 const r=new FileReader();

 r.onload=()=>{

  try{

   const x=JSON.parse(r.result);

   if(!x.accounts)throw Error();

   DB=x;

   saveDB();

   loadLoginAccounts();

   toast("Restore successful");

   setTimeout(()=>location.reload(),500);

  }catch{

   toast("Invalid backup file");

  }

 };

 r.readAsText(f);
}

/* ================= CSV ================= */

function exportCSV(type){

 if(type!=="sales")return;

 const rows=[

  [
   "Invoice",
   "Date",
   "Type",
   "Table",
   "Customer",
   "Payment",
   "Subtotal",
   "Tax",
   "Total",
   "Profit"
  ],

  ...acc().sales.map(s=>[
   s.invoice,
   s.date,
   s.orderType||"Takeaway",
   s.tableName||"",
   s.customer,
   s.payment,
   s.subtotal,
   s.tax,
   s.total,
   s.profit
  ])

 ];

 const csv=
 rows.map(r=>
  r.map(v=>
   `"${String(v).replaceAll('"','""')}"`
  ).join(",")
 ).join("\n");

 const b=new Blob(
  [csv],
  {type:"text/csv"}
 );

 const a=document.createElement("a");

 a.href=URL.createObjectURL(b);

 a.download=
 "easy-bill-sales-"+today()+".csv";

 a.click();

 URL.revokeObjectURL(a.href);

 toast("CSV exported");
}

setInterval(()=>{

 const c=document.getElementById("clock");

 if(c){
  c.textContent=
   " • "+new Date().toLocaleString();
 }

},1000);

/* ================= START ================= */

loadLoginAccounts();

if(
 DB.currentUser &&
 DB.activeAccount &&
 acc()
){

 document.getElementById("login").style.display="none";

 document.getElementById("app").classList.add("active");

 updateHeader();

 go("dashboard");

}else{

 document.getElementById("login").style.display="grid";

}
