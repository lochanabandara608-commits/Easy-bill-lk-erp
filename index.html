<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>EASY BILL LK - ERP POS</title>
<style>
/*... oyage wena css okkoma eya wagemai... */

/* BILL TABS */
.billTabs{
  display:flex;
  gap:6px;
  padding:10px;
  background:#f2f5f9;
  border-bottom:1px solid #ddd;
  overflow-x:auto;
}
.billTab{
  padding:8px 14px;
  background:#fff;
  border:1px solid #ddd;
  border-radius:6px;
  cursor:pointer;
  white-space:nowrap;
  font-size:13px;
  position:relative;
}
.billTab.active{
  background:#3159b7;
  color:#fff;
  border-color:#3159b7;
}
.billTab.close{
  margin-left:8px;
  font-size:16px;
  color:#e53935;
}
.addBillBtn{
  padding:8px 14px;
  background:#18a558;
  color:#fff;
  border:0;
  border-radius:6px;
  cursor:pointer;
  font-weight:bold;
}
</style>
</head>

<body>
<!-- LOGIN + APP HTML OKKOMA EYA WAGEMAI -->

<!-- POS PAGE EKA WITHARAK CHANGE -->
<section id="posPage" class="hidden">
<div class="posLayout">

<div class="panel">
<div class="panelHead">PRODUCTS</div>
<div class="searchRow">
<input id="productSearch" placeholder="Search item / scan barcode..." oninput="renderProducts()" onkeydown="barcodeEnter(event)">
<button onclick="barcodeFocus()">⌕</button>
</div>
<div class="products" id="products"></div>
</div>

<div class="panel billPanel">
  <!-- BILL TABS ADD KALA -->
  <div class="billTabs" id="billTabs">
    <button class="addBillBtn" onclick="newBill()">+ NEW BILL</button>
  </div>

  <div class="billHead">
    <div class="billNo" id="currentBillNo">BILL #000001</div>
    <select id="customerSelect" class="customerSelect"><option value="">Walk-in Customer</option></select>
  </div>

  <div class="billItems" id="billItems"></div>

  <div class="billSummary">
    <div class="sumRow"><span>Subtotal</span><b id="subtotal">Rs. 0.00</b></div>
    <div class="sumRow"><span>Discount</span><input id="discount" type="number" value="0" min="0" style="width:80px;height:28px" oninput="updateBill()"></div>
    <div class="sumRow totalRow"><span>TOTAL</span><span id="grandTotal">Rs. 0.00</span></div>

    <div class="paymentGrid">
      <button class="active" onclick="setPayment('Cash',this)">Cash</button>
      <button onclick="setPayment('Card',this)">Card</button>
      <button onclick="setPayment('Credit',this)">Credit</button>
    </div>

    <input id="cashReceived" class="cashInput" type="number" placeholder="Cash received" oninput="updateChange()">
    <div class="sumRow"><span>Change</span><b id="change">Rs. 0.00</b></div>

    <div class="posActions">
      <button class="action btnHold" onclick="holdBill()">HOLD</button>
      <button class="action btnClear" onclick="clearBill()">CLEAR</button>
      <button class="action btnPrint" onclick="printBill()">PRINT BILL</button>
      <button class="action btnPay" onclick="completeSale()">SAVE / PAY</button>
    </div>
  </div>
</div>

</div>
</section>

<!-- WENA MODAL OKKOMA EYA WAGEMAI -->

<script>
/* ======================================================
DATABASE + WENA CODE OKKOMA EYA WAGEMAI
====================================================== */

const DB_KEY="EASY_BILL_LK_DATABASE_V5";
let db=null;
let currentUser=null;
let activeBills=[]; // meken bill wada karanna
let currentBillIndex=0; // mokakda danata active
let paymentMethod="Cash";
let heldBills=[];

/* DB LOAD + SAVE OKKOMA EYA WAGEMAI */

/* ======================================================
BILL TAB FUNCTIONS - ALUTH
====================================================== */

function newBill(){
  activeBills.push({
    id: Date.now(),
    number: "BILL #"+String(db.billCounter).padStart(6,"0"),
    kotNo: "KOT-"+String(db.billCounter).padStart(6,"0"),
    items: [],
    discount: 0,
    customer: "",
    payment: "Cash"
  });
  currentBillIndex = activeBills.length - 1;
  db.billCounter++;
  renderBillTabs();
  renderBill();
}

function switchBill(index){
  currentBillIndex = index;
  renderBillTabs();
  renderBill();
}

function closeBillTab(index, e){
  e.stopPropagation();
  if(activeBills.length <= 1){
    alert("Last bill eka close karanna ba");
    return;
  }
  activeBills.splice(index,1);
  if(currentBillIndex >= index) currentBillIndex--;
  renderBillTabs();
  renderBill();
}

function renderBillTabs(){
  const container = document.getElementById("billTabs");
  const tabs = activeBills.map((b,i)=>`
    <div class="billTab ${i===currentBillIndex?'active':''}" onclick="switchBill(${i})">
      ${b.number}
      ${activeBills.length>1?`<span class="close" onclick="closeBillTab(${i},event)">×</span>`:''}
    </div>
  `).join("");
  container.innerHTML = `<button class="addBillBtn" onclick="newBill()">+ NEW BILL</button>` + tabs;
}

function getCurrentBill(){
  return activeBills[currentBillIndex] || {items:[], discount:0, customer:"", payment:"Cash"};
}

/* ======================================================
POS UPDATE - BILL ARRAY EKEN WEDA
====================================================== */

function addToBill(id){
  const item=db.items.find(function(i){return i.id===id;});
  if(!item) return;
  if(item.stock<=0){ alert("Out of stock."); return; }

  const bill = getCurrentBill();
  const found=bill.items.find(function(x){return x.id===id;});
  if(found){
    if(found.qty>=item.stock){ alert("Not enough stock."); return; }
    found.qty++;
  }else{
    bill.items.push({id:item.id,name:item.name,barcode:item.barcode,price:Number(item.price),qty:1});
  }
  renderBill();
}

function renderBill(){
  const bill = getCurrentBill();
  document.getElementById("currentBillNo").textContent = bill.number;
  document.getElementById("discount").value = bill.discount || 0;

  const container = document.getElementById("billItems");
  if(!bill.items.length){
    container.innerHTML=`<div style="text-align:center;color:#999;padding:50px 10px">No items added</div>`;
  }else{
    container.innerHTML=bill.items.map(function(x,index){
      return `
      <div class="billItem">
        <div><b>${esc(x.name)}</b><br><small>Rs. ${money(x.price)}</small></div>
        <div class="qtyControl">
          <button onclick="changeQty(${index},-1)">−</button>
          <input value="${x.qty}" onchange="manualQty(${index},this.value)">
          <button onclick="changeQty(${index},1)">+</button>
        </div>
        <b>Rs. ${money(x.price*x.qty)}</b>
        <button class="remove" onclick="removeBillItem(${index})">×</button>
      </div>`;
    }).join("");
  }
  updateBill();
}

function changeQty(index,d){
  const bill = getCurrentBill();
  const x=bill.items[index]; if(!x)return;
  const item=db.items.find(function(i){return i.id===x.id;});
  x.qty+=d;
  if(x.qty<=0){ bill.items.splice(index,1); }
  if(item&&x.qty>item.stock){ x.qty=item.stock; alert("Not enough stock."); }
  renderBill();
}

function manualQty(index,value){
  const bill = getCurrentBill();
  const item=db.items.find(function(i){return i.id===bill.items[index].id;});
  bill.items[index].qty = Math.min(Math.max(1,Number(value)||1), item.stock);
  renderBill();
}

function removeBillItem(index){
  getCurrentBill().items.splice(index,1);
  renderBill();
}

function updateBill(){
  const bill = getCurrentBill();
  bill.discount = Number(document.getElementById("discount").value)||0;
  const subtotal = bill.items.reduce(function(s,x){return s+x.price*x.qty;},0);
  const total = Math.max(0,subtotal-bill.discount);
  document.getElementById("subtotal").textContent="Rs. "+money(subtotal);
  document.getElementById("grandTotal").textContent="Rs. "+money(total);
  updateChange();
}

function getGrandTotal(){
  const bill = getCurrentBill();
  const subtotal = bill.items.reduce(function(s,x){return s+x.price*x.qty;},0);
  return Math.max(0,subtotal-bill.discount);
}

function clearBill(){
  const bill = getCurrentBill();
  bill.items=[]; bill.discount=0;
  document.getElementById("cashReceived").value="";
  renderBill();
}

function holdBill(){
  const bill = getCurrentBill();
  if(!bill.items.length){ alert("Bill is empty."); return; }
  heldBills.push(JSON.parse(JSON.stringify(bill)));
  activeBills.splice(currentBillIndex,1);
  if(activeBills.length==0) newBill(); else if(currentBillIndex>=activeBills.length) currentBillIndex=activeBills.length-1;
  renderBillTabs(); renderBill();
  alert("Bill held.");
}

function completeSale(){
  const bill = getCurrentBill();
  if(!bill.items.length){ alert("Add items first."); return; }
  const total=getGrandTotal();
  if(paymentMethod==="Cash"){
    const received=Number(document.getElementById("cashReceived").value)||0;
    if(received<total){ alert("Cash received is insufficient."); return; }
  }
  bill.items.forEach(function(x){
    const item=db.items.find(function(i){return i.id===x.id;});
    if(item) item.stock-=x.qty;
  });
  const subtotal = bill.items.reduce(function(s,x){return s+x.price*x.qty;},0);
  const dbBill={
    id:"bill-"+Date.now(), number:bill.number, date:new Date().toISOString(),
    cashier:currentUser.username, customer:bill.customer||"Walk-in Customer",
    payment:paymentMethod, items:JSON.parse(JSON.stringify(bill.items)),
    subtotal:subtotal, discount:bill.discount, total:total, kotNo:bill.kotNo
  };
  db.bills.push(dbBill); saveDB();
  printReceiptAndKOT(dbBill);
  activeBills.splice(currentBillIndex,1);
  if(activeBills.length==0) newBill(); else if(currentBillIndex>=activeBills.length) currentBillIndex=activeBills.length-1;
  document.getElementById("cashReceived").value="";
  renderBillTabs(); renderBill(); refreshAll();
}

function printBill(){
  const bill = getCurrentBill();
  if(!bill.items.length){ alert("Bill is empty."); return; }
  const subtotal = bill.items.reduce(function(s,x){return s+x.price*x.qty;},0);
  const printObj={
    number:bill.number, date:new Date().toISOString(), cashier:currentUser.username,
    customer:bill.customer||"Walk-in Customer", payment:paymentMethod,
    items:JSON.parse(JSON.stringify(bill.items)), subtotal:subtotal,
    discount:bill.discount, total:getGrandTotal(), kotNo:bill.kotNo
  };
  printReceiptAndKOT(printObj);
}

/* ======================================================
LOGIN + REFRESH + WENA OKKOMA EYA WAGEMAI
====================================================== */

function login(){
  loadDB();
  const username=document.getElementById("loginUser").value.trim();
  const password=document.getElementById("loginPass").value;
  const account=db.accounts.find(function(a){return String(a.username).toLowerCase()===username.toLowerCase() && String(a.password)===password && a.active===true;});
  if(!account){ document.getElementById("loginMsg").style.color="#e53935"; document.getElementById("loginMsg").textContent="Invalid username or password."; return; }
  currentUser=account;
  document.getElementById("loginPage").style.display="none";
  document.getElementById("app").style.display="block";
  document.getElementById("sideUser").textContent=account.name;
  document.getElementById("sideRole").textContent=account.role;
  document.getElementById("topUser").textContent=account.name;
  document.getElementById("loginMsg").textContent="";
  activeBills=[]; newBill(); // login unama aluth bill 1k open
  refreshAll();
}

/* WENA FUNCTIONS OKKOMA EYA WAGEMAI. money, esc, renderDashboard etc */

/* INITIAL */
renderDashboard();
</script>
</body>
</html>
