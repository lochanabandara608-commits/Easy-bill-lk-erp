<!DOCTYPE html>
<html>
<head>
<title>EB Easy Bill LK</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{margin:0;font-family:Arial;background:#f4f4f4}
#loginBox{display:flex;justify-content:center;align-items:center;height:100vh}
.login-card{background:white;padding:40px;border-radius:10px;width:350px;box-shadow:0 4px 20px rgba(0,0,0,0.1)}
#dashboard{display:none}
.navbar{background:#007bff;color:white;padding:15px;display:flex;justify-content:space-between}
.sidebar{width:220px;background:white;height:100vh;position:fixed;padding-top:20px}
.sidebar a{display:block;padding:12px 20px;cursor:pointer}
.sidebar a:hover{background:#007bff;color:white}
.content{margin-left:240px;padding:20px}
.page{display:none}.page.active{display:block}
.card{background:white;padding:20px;border-radius:8px;margin-bottom:20px}
input,button{padding:10px;margin:5px;border:1px solid #ddd;border-radius:5px}
button{background:#007bff;color:white;cursor:pointer;border:none}
table{width:100%;background:white;border-collapse:collapse}
th,td{padding:10px;border:1px solid #ddd}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginBox">
  <div class="login-card">
    <h1>EB Easy Bill LK</h1>
    <p id="msg" style="color:red"></p>
    <input type="text" id="user" placeholder="Username" value="admin">
    <input type="password" id="pass" placeholder="Password" value="admin123">
    <button id="loginBtn">Login</button>
    <p><b>Demo:</b> admin/admin123 | cashier/cashier123</p>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <div class="navbar">
    <h2>EB Easy Bill LK</h2>
    <div><span id="role"></span> | <button id="logoutBtn" style="width:80px">Logout</button></div>
  </div>
  <div class="sidebar">
    <a onclick="show('dash')">📊 Dashboard</a>
    <a onclick="show('bill')">🛒 Billing</a>
    <a onclick="show('prod')">📦 Products</a>
  </div>
  <div class="content">
    <div id="dash" class="page active"><h3>Overview</h3><div class="card"><h4>Total Sales</h4><p id="total">Rs. 0</p></div></div>
    
    <div id="bill" class="page"><h3>POS Billing</h3>
      <div class="card">
        <input id="pname" placeholder="Product Name">
        <input id="pprice" type="number" placeholder="Price">
        <button onclick="addBill()">Add to Bill</button>
      </div>
      <table id="billTable"><tr><th>Item</th><th>Price</th></tr></table>
      <h4>Total: Rs.<span id="billTotal">0</span></h4>
      <button onclick="completeSale()">Complete Sale</button>
    </div>

    <div id="prod" class="page"><h3>Products</h3>
      <div class="card">
        <input id="newP" placeholder="Product Name">
        <input id="newPrice" type="number" placeholder="Price">
        <button onclick="addProd()">Add Product</button>
      </div>
      <table id="prodTable"><tr><th>Product</th><th>Price</th></tr></table>
    </div>
  </div>
</div>

<script>
let bill = 0, billItems = [], products = JSON.parse(localStorage.getItem('products'))||[], sales = JSON.parse(localStorage.getItem('sales'))||[];

document.getElementById('loginBtn').onclick = ()=>{
  let u=user.value, p=pass.value;
  if((u=='admin'&&p=='admin123')||(u=='cashier'&&p=='cashier123')){
    loginBox.style.display='none'; dashboard.style.display='block'; role.innerText=u;
    if(u=='cashier') document.querySelector('.sidebar a:nth-child(3)').style.display='none';
    loadProd(); loadTotal();
  } else msg.innerText='Wrong Login';
}

function show(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function addBill(){
  let n=pname.value, pr=+pprice.value;
  billItems.push({n,pr}); bill+=pr;
  billTotal.innerText=bill;
  billTable.innerHTML+=`<tr><td>${n}</td><td>${pr}</td></tr>`;
  pname.value=''; pprice.value='';
}

function completeSale(){
  sales.push({items:billItems,total:bill,date:new Date()});
  localStorage.setItem('sales',JSON.stringify(sales));
  alert('Sale Saved!');
  bill=0; billItems=[]; billTable.innerHTML='<tr><th>Item</th><th>Price</th></tr>'; billTotal.innerText=0;
  loadTotal();
}

function addProd(){
  products.push({n:newP.value,pr:+newPrice.value});
  localStorage.setItem('products',JSON.stringify(products));
  loadProd();
}

function loadProd(){
  prodTable.innerHTML='<tr><th>Product</th><th>Price</th></tr>';
  products.forEach(p=>prodTable.innerHTML+=`<tr><td>${p.n}</td><td>${p.pr}</td></tr>`);
}

function loadTotal(){
  total.innerText='Rs. '+sales.reduce((a,b)=>a+b.total,0);
}

document.getElementById('logoutBtn').onclick = ()=>location.reload();
</script>
</body>
</html>
