<!DOCTYPE html>
<html>
<head>
<title>EB Easy Bill LK</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{margin:0;font-family:Arial;background:#f0f2f5;display:flex;justify-content:center;align-items:center;height:100vh}
.login-box{background:white;padding:40px;border-radius:10px;width:350px;box-shadow:0 4px 20px rgba(0,0,0,0.1)}
.login-box h1{text-align:center}
input{width:100%;padding:12px;margin:10px 0;border:1px solid #ccc;border-radius:5px}
button{width:100%;padding:12px;background:#007bff;color:white;border:none;border-radius:5px;font-size:16px;cursor:pointer}
#dashboard{display:none;padding:20px}
.navbar{background:#007bff;color:white;padding:15px}
</style>
</head>
<body>

<div class="login-box" id="loginBox">
  <h1>EB Easy Bill LK</h1>
  <p id="msg" style="color:red;text-align:center"></p>
  <input type="text" id="user" placeholder="Username">
  <input type="password" id="pass" placeholder="Password">
  <button onclick="login()">Login</button>
  <p><b>Demo:</b> admin/admin123<br><b>Cashier:</b> cashier/cashier123</p>
</div>

<div id="dashboard">
  <div class="navbar">
    <span>EB Easy Bill LK Dashboard</span>
    <button onclick="logout()" style="float:right">Logout</button>
  </div>
  <h2>Welcome <span id="role"></span> ✅</h2>
  <p>Login Success! දැන් ඔයා ඇතුලේ.</p>
</div>

<script>
function login(){
  var u = document.getElementById('user').value;
  var p = document.getElementById('pass').value;
  
  if(u == 'admin' && p == 'admin123'){
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    document.getElementById('role').innerText = 'Admin';
  }
  else if(u == 'cashier' && p == 'cashier123'){
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    document.getElementById('role').innerText = 'Cashier';
  }
  else{
    document.getElementById('msg').innerText = 'Username or Password is wrong';
  }
}

function logout(){
  location.reload();
}
</script>

</body>
</html>
